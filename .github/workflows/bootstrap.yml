name: One-time repository bootstrap

on:
  push:
    branches: [wasserstein-dfl-implementation]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: wasserstein-dfl-implementation
          fetch-depth: 0

      - name: Materialize repository without changing workflows
        run: |
          cp .github/workflows/bootstrap.yml /tmp/bootstrap.yml
          cat .bootstrap/part*.b64 | base64 --decode > /tmp/repository.tar.gz
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/repository.tar.gz -C .
          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp /tmp/bootstrap.yml .github/workflows/bootstrap.yml

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement KL-DRO decision-focused shortest-path benchmark"
          git push origin HEAD:wasserstein-dfl-implementation
