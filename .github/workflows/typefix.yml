name: One-time strict typing cleanup

on:
  push:
    branches: [wasserstein-dfl-implementation]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: wasserstein-dfl-implementation
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install typing and quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2,<3"
          python -m pip install -e ".[dev]"

      - name: Apply strict typing fixes
        run: |
          echo '' | base64 --decode > /tmp/typefix.py
          python /tmp/typefix.py

      - name: Verify the patched tree
        run: |
          ruff check --fix --unsafe-fixes .
          ruff format .
          ruff check .
          ruff format --check .
          mypy --python-version "3.11" src
          pytest

      - name: Commit strict typing fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix strict typing boundaries"
          git push origin HEAD:wasserstein-dfl-implementation
